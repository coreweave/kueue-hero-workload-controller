{{- if and .Values.metrics.service.enabled (ne (toString .Values.metrics.bindAddress) "0") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hero.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hero.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hero.selectorLabels" . | nindent 4 }}
  ports:
  - name: metrics
    port: {{ .Values.metrics.service.port }}
    targetPort: metrics
{{- end }}
